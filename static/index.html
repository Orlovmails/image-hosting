<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хостинг зображень</title>
    <link rel="stylesheet" href="/css/reset.css?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=1">
</head>

<body>
    <header>
        <div class="header">
            <h1 class="header__title">Завантаження фото</h1>
            <p class="header__text">Завантажуйте селфі, меми чи будь-які картинки та отримуйте пряме посилання.</p>
        </div>
        <!-- Посилання на основні маршрути сервісу (вимога ТЗ) -->
        <div class="header__button">
            <button class="header__button-btn" data-href="/upload">Завантажити зображення</button>
            <button class="header__button-btn" data-href="/images/">Каталог зображень</button>
        </div>
    </header>
    <main>
        <div class="hero">
            <div class="hero__img">
                <img class="img" src="/img/Nord.png" alt="Nord">
            </div>
            <div class="hero__img">
                <img class="img" src="/img/Cat.png" alt="Cat">
            </div>
            <div class="hero__img">
                <img class="img" src="/img/Griz.png" alt="Griz">
            </div>
            <div class="hero__img">
                <img class="img" src="/img/Zero.png" alt="Zero">
            </div>
            <div class="hero__img">
                <img class="img" src="/img/Eric.png" alt="Eric">
            </div>
        </div>
    </main>
    <script src="/js/index.js?v=1"></script>
</body>

</html>
