# Налаштування Nginx.
# Файл монтується в контейнер як /etc/nginx/conf.d/default.conf і замінює
# стандартний server-блок. Глобальні налаштування, mime.types і логи
# лишаються рідними, тому головний nginx.conf ми не чіпаємо.

server {
    listen 80;
    server_name localhost;

    # Дозволяємо трохи більше за 5 МБ, щоб файли рівно на 5 МБ проходили.
    # Таке саме число стоїть в app.py у HARD_BODY_LIMIT.
    client_max_body_size 6m;

    # Завеликий запит Nginx ріже сам і віддає 413, а за ТЗ потрібен 400.
    # Тому підміняємо відповідь на таку саму JSON-помилку, як у бекенду.
    error_page 413 = @too_large;

    location @too_large {
        default_type application/json;
        return 400 '{"error": "файл більший за 5 МБ"}';
    }

    # Стара адреса каталогу. Точний збіг (=) сильніший за префікс /images/,
    # тому запит іде на бекенд, і той перенаправляє на /images-list. Самі файли нижче.
    location = /images/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
    }

    # Роздача завантажених картинок прямо з тому images.
    # Тут root, а не alias: "/" + "/images/file.png" дає "/images/file.png",
    # і try_files працює без відомої проблеми зв'язки alias з try_files.
    # ^~ означає: якщо префікс збігся, регулярки далі не перевіряємо.
    location ^~ /images/ {
        root /;
        try_files $uri =404;
        autoindex off;
        access_log off;
        expires 30d;
    }

    # Статику сайту теж віддає Nginx, щоб не турбувати Python.
    # У CSS і JS імена постійні, без хешів, тому намертво їх не кешуємо:
    # no-cache означає, що браузер щоразу перепитує, а Nginx відповідає 304.
    # Інакше після оновлення сайту користувач сидів би зі старим скриптом.
    location ~ ^/(css|js)/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    # Картінки самого сайту не змінюються, їх можна кешувати надовго
    location ^~ /img/ {
        root /usr/share/nginx/html;
        access_log off;
        expires 7d;
    }

    # Все інше (/, /upload, /images-list, /delete/...) віддаємо бекенду
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
